<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc"><title id="title">三条 APP 数据管线</title><desc id="desc">从场景、对话到画像的三阶段生成。结构化生成 · 模型对比 · 校验与人工二审。600+ 标注样本；场景 → 对话 → 画像。</desc><style>
    .flow{stroke-dasharray:4 42;animation:flow 16s linear infinite}
    .pulse{animation:pulse 7s ease-in-out infinite}
    .cloud{animation:cloud 26s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-184}}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:.85}}
    @keyframes cloud{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.cloud{animation:none}}
    </style><rect x=".5" y=".5" width="899" height="179" rx="12" fill="#152537" stroke="#304356"/><rect x="1" y="27" width="3" height="124" rx="1" fill="#70d4c1"/><text x="28" y="32" fill="#a1b3c5" font-family="&#x27;Cascadia Code&#x27;,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="1">02 / DATA GENERATION</text><text x="28" y="72" fill="#e6edf5" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="27" font-weight="600" >三条 APP 数据管线</text><text x="28" y="102" fill="#e6edf5" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="500" >从场景、对话到画像的三阶段生成</text><text x="28" y="143" fill="#a1b3c5" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="13" font-weight="400" >结构化生成 · 模型对比 · 校验与人工二审</text><path d="M600 28V151" stroke="#304356"/><text x="635" y="81" fill="#70d4c1" font-family="&#x27;Cascadia Code&#x27;,Consolas,monospace" font-size="45" font-weight="600" >600+</text><text x="635" y="109" fill="#e6edf5" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="400" >标注样本</text><text x="635" y="144" fill="#a1b3c5" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" >场景 → 对话 → 画像</text><text x="854" y="33" fill="#a1b3c5" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" >↗</text></svg>
