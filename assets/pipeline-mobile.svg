<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc"><title id="title">三条 APP 数据管线</title><desc id="desc">从场景、对话到画像的三阶段生成。600+ 标注样本。结构化生成 · 模型对比 · 校验与人工二审</desc><style>
    .flow{stroke-dasharray:4 42;animation:flow 16s linear infinite}
    .pulse{animation:pulse 7s ease-in-out infinite}
    .cloud{animation:cloud 26s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-184}}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:.85}}
    @keyframes cloud{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.cloud{animation:none}}
    </style><rect x=".5" y=".5" width="479" height="239" rx="12" fill="#ffffff" stroke="#d0dce4"/><rect x="1" y="24" width="3" height="192" rx="1" fill="#197f73"/><text x="24" y="32" fill="#536b7f" font-family="&#x27;Cascadia Code&#x27;,Consolas,monospace" font-size="11" font-weight="400" >02 / DATA GENERATION</text><text x="24" y="75" fill="#203449" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="30" font-weight="600" >三条 APP 数据管线</text><text x="24" y="108" fill="#203449" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="18" font-weight="400" >从场景、对话到画像的三阶段生成</text><text x="24" y="158" fill="#197f73" font-family="&#x27;Cascadia Code&#x27;,Consolas,monospace" font-size="37" font-weight="600" >600+</text><text x="139" y="154" fill="#203449" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="17" font-weight="400" >标注样本</text><text x="24" y="188" fill="#536b7f" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="400" >场景 → 对话 → 画像</text><text x="24" y="219" fill="#536b7f" font-family="&#x27;Segoe UI&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="15" font-weight="400" >结构化生成 · 模型对比 · 校验与人工二审</text></svg>
